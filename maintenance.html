<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lớp Mình đang được bảo trì. Vui lòng quay lại sau.">
  <title>Hệ thống đang bảo trì | Lớp Mình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/error-pages.css">
</head>
<body>
  <main class="status-page status-page--maintenance">
    <section class="status-card" aria-labelledby="status-title">
      <span class="status-brand">Lớp Mình</span>
      <div class="status-illustration" aria-hidden="true">
        <svg viewBox="0 0 64 64" focusable="false">
          <path d="M39.5 10.5a18 18 0 0 0-22.8 22.8L7.5 42.5a7 7 0 0 0 9.9 9.9l9.2-9.2a18 18 0 0 0 22.8-22.8L39 30.8l-5.7-5.7 6.2-14.6Z" />
          <circle cx="14.5" cy="45.5" r="2.5" />
        </svg>
      </div>
      <p class="status-eyebrow">Thông báo dịch vụ</p>
      <h1 id="status-title">Hệ thống đang được bảo trì</h1>
      <p class="status-description">Chúng tôi đang thực hiện bảo trì để cải thiện dịch vụ. Một số chức năng tạm thời chưa sử dụng được; vui lòng quay lại sau.</p>
      <div class="status-actions">
        <a class="status-button" href="">Kiểm tra lại</a>
      </div>
      <p class="status-help">Cảm ơn bạn đã kiên nhẫn và thông cảm.</p>
    </section>
  </main>
</body>
</html>
