<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trang bạn tìm không tồn tại hoặc đã được chuyển tại Lớp Mình.">
  <title>Không tìm thấy trang | Lớp Mình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/error-pages.css">
</head>
<body>
  <main class="status-page status-page--not-found">
    <section class="status-card" aria-labelledby="status-title">
      <span class="status-brand">Lớp Mình</span>
      <div class="status-illustration" aria-hidden="true">
        <span class="status-code">404</span>
      </div>
      <p class="status-eyebrow">Không tìm thấy trang</p>
      <h1 id="status-title">Có vẻ bạn đã đi nhầm đường</h1>
      <p class="status-description">Địa chỉ bạn truy cập không tồn tại hoặc đã được thay đổi. Hãy kiểm tra lại đường dẫn hoặc dùng nút quay lại của trình duyệt.</p>
      <p class="status-help">Nếu bạn cho rằng đây là nhầm lẫn, hãy liên hệ giáo viên phụ trách.</p>
    </section>
  </main>
</body>
</html>
