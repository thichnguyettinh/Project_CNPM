<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lớp Mình đang gặp sự cố. Vui lòng thử lại sau.">
  <title>Lỗi hệ thống | Lớp Mình</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/error-pages.css">
</head>
<body>
  <main class="status-page status-page--server-error">
    <section class="status-card" aria-labelledby="status-title">
      <span class="status-brand">Lớp Mình</span>
      <div class="status-illustration" aria-hidden="true">
        <span class="status-code">500</span>
      </div>
      <p class="status-eyebrow">Lỗi hệ thống</p>
      <h1 id="status-title">Chúng tôi đang gặp sự cố</h1>
      <p class="status-description">Yêu cầu chưa thể hoàn tất. Vui lòng thử tải lại trang sau ít phút; nếu sự cố tiếp diễn, hãy liên hệ giáo viên phụ trách.</p>
      <div class="status-actions">
        <a class="status-button" href="">Thử tải lại</a>
      </div>
      <p class="status-help">Mã lỗi: 500 · Lỗi máy chủ nội bộ</p>
    </section>
  </main>
</body>
</html>
